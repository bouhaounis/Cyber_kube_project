apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksoc-dashboard
  namespace: k-soc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ksoc-dashboard
  template:
    metadata:
      labels:
        app: ksoc-dashboard
    spec:
      serviceAccountName: ksoc-service-account
      containers:
        - name: dashboard
          image: cyberkube/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
