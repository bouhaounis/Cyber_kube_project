apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ksoc-ebpf-agent
  namespace: k-soc
spec:
  selector:
    matchLabels:
      app: ksoc-ebpf-agent
  template:
    metadata:
      labels:
        app: ksoc-ebpf-agent
    spec:
      serviceAccountName: ksoc-service-account
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: ebpf-agent
          image: cyberkube/ebpf-agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: lib-modules
          hostPath:
            path: /lib/modules
