apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksoc-ml-service
  namespace: k-soc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ksoc-ml-service
  template:
    metadata:
      labels:
        app: ksoc-ml-service
    spec:
      serviceAccountName: ksoc-service-account
      containers:
        - name: ml-service
          image: cyberkube/ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "/app/artifacts/anomaly_detection.onnx"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
