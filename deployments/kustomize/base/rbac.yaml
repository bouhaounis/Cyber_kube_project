apiVersion: v1
kind: ServiceAccount
metadata:
  name: ksoc-service-account
  namespace: k-soc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ksoc-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ksoc-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ksoc-cluster-role
subjects:
  - kind: ServiceAccount
    name: ksoc-service-account
    namespace: k-soc
