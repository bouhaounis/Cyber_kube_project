[package]
name = "cyber-kube-ebpf-loader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ebpf-loader"
path = "src/main.rs"

[dependencies]
aya = "0.12"
aya-log = "0.2"
bytes = "1.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
ctrlc = "3.4"
env_logger = "0.11"

[workspace]
members = [".."]
